name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ENGINE_CART_RAILS_OPTIONS: '--skip-javascript --skip-bundle'
      RAILS_VERSION: '~> 8.0'
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3']
    name: Ruby ${{ matrix.ruby }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}

    - name: Install dependencies
      run: bundle install

    - name: Run rubocop
      run: rake rubocop

    - name: Generate a Rails testing application
      run: rake engine_cart:generate

    - name: Add Sprockets manifest to testing application
      run: |
        mkdir -p .internal_test_app/app/assets/config
        printf '%s\n' \
          '//= link_tree ../images' \
          '//= link_directory ../stylesheets .css' \
          '//= link_directory ../javascripts .js' \
          > .internal_test_app/app/assets/config/manifest.js

    - name: Run tests
      run: rspec
